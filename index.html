<script>
'use strict';
const S={unsynced:new Set(),pages:[],tasks:[],dbUrl:'',view:'home',currentId:null,dirty:new Set(),timers:new Map(),queues:new Map(),saving:0,theme:localStorage.getItem('notionlite-theme')||'light'};
document.body.classList.toggle('dark',S.theme==='dark');
const $=id=>document.getElementById(id);
const MOBILE_EDITOR=window.matchMedia('(max-width:850px), (pointer:coarse)').matches;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Serialize ALL mutations (not only edits to the same page) to avoid
// simultaneous Apps Script executions competing for the spreadsheet lock.
const MUTATIONS=new Set(['createPage','savePage','deletePage','movePage','upsertTask','deleteTask','uploadAttachment','finishLargeAttachment','cleanupOrphanedAttachments']);
let mutationQueue=Promise.resolve();
/* v13 standalone: talk to the Apps Script API over HTTPS with a secret key.
 * A text/plain body is a "simple" request, so the browser sends it without a CORS preflight. */
const CONN_KEY='notionlite-conn',CACHE_KEY='notionlite-cache-v1';
function getConn(){try{return JSON.parse(localStorage.getItem(CONN_KEY)||'null');}catch(_){return null;}}
function invokeApi(name,args){const conn=getConn();if(!conn)return Promise.reject(new Error('ยังไม่ได้เชื่อมต่อ (Settings)'));return callApi(conn,name,args);}
async function callApi(conn,name,args){
  let res;
  try{res=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:conn.key,fn:name,args:args||[]}),redirect:'follow'});}
  catch(e){const err=new Error('ออฟไลน์ หรือเชื่อมต่อ Google ไม่ได้');err.offline=true;throw err;}
  const text=await res.text();let data;
  try{data=JSON.parse(text);}catch(_){throw new Error(res.ok?'Apps Script ไม่ได้ตอบเป็น JSON — ตรวจว่า Deploy แบบ Who has access: Anyone และใช้ลิงก์ที่ลงท้าย /exec':'HTTP '+res.status);}
  if(!data.ok)throw new Error(data.error||'Server error');
  return data.result;
}
function api(name,...args){
  if(!MUTATIONS.has(name))return invokeApi(name,args);
  const attempt=async()=>{
    for(let i=0;i<3;i++){
      try{return await invokeApi(name,args);}
      catch(e){
        const busy=/lock timeout|could not obtain a lock|busy saving another change/i.test(e.message);
        if(!busy||i===2)throw e;
        status('Workspace busy; retrying save…');
        await new Promise(r=>setTimeout(r,900*(i+1)));
      }
    }
  };
  // Track changes in flight so a background refresh that started earlier can't
  // bring back something you just deleted or changed.
  S.mutSeq=(S.mutSeq||0)+1;S.inflight=(S.inflight||0)+1;
  const current=mutationQueue.catch(()=>{}).then(attempt);
  mutationQueue=current.catch(()=>{});
  const done=()=>{S.inflight--;S.mutSeq++;};current.then(done,done);
  return current;
}
function notify(msg){const n=el('div','toast',msg);$('toastRoot').replaceChildren(n);setTimeout(()=>{if(n.isConnected)n.remove();},4000);}
function error(e){console.error(e);notify('Error: '+(e.message||e));status('Save failed',true);}
function status(t,isError=false){const e=$('saveStatus');e.textContent=t;e.classList.toggle('error',isError);}
function pageById(id){return S.pages.find(p=>p.id===id);}
function sortPages(a,b){const ax=Number.isFinite(a.sortOrder)?a.sortOrder:9999999,bx=Number.isFinite(b.sortOrder)?b.sortOrder:9999999;return ax-bx || a.title.localeCompare(b.title);}
function siblings(parent){return S.pages.filter(p=>p.parentId===parent).sort(sortPages);}
async function movePageOnServer(id,parent,index){
  try{
    status('Moving page…');
    // Save pending editor changes first; server writes only hierarchy columns.
    await Promise.all([...S.dirty].map(savePageNow));
    const result=await api('movePage',id,parent,index);
    result.pages.forEach(update=>{const page=pageById(update.id);if(page)Object.assign(page,update);});
    status('Folder saved ✓');render();notify('Page moved');
  }catch(err){error(err);}
}
function shiftPage(id,delta){
  const page=pageById(id),list=siblings(page.parentId);
  const i=list.findIndex(p=>p.id===id),j=i+delta;
  if(j<0||j>=list.length)return;
  movePageOnServer(id,page.parentId,j);
}
function pageDescendants(id){const ids=new Set([id]);let changed=true;while(changed){changed=false;S.pages.forEach(p=>{if(ids.has(p.parentId)&&!ids.has(p.id)){ids.add(p.id);changed=true;}});}return ids;}
function openMoveModal(pageId){
  const page=pageById(pageId),root=$('modalRoot');root.replaceChildren();
  const bg=el('div','modal-back'),modal=el('div','modal');modal.append(el('h2','','Move: '+page.title));
  modal.append(el('p','hint','Choose a parent folder. Select Workspace root to make a top-level page.'));
  const wrap=el('div','formfield');wrap.append(el('label','','Destination folder'));
  const select=el('select');select.add(new Option('🏠 Workspace root',''));
  const banned=pageDescendants(pageId);
  function addOptions(parent,depth){siblings(parent).forEach(p=>{if(banned.has(p.id))return;select.add(new Option('　'.repeat(depth)+'📁 '+p.title,p.id));addOptions(p.id,depth+1);});}
  addOptions('',0);select.value=page.parentId;wrap.append(select);modal.append(wrap);
  const actions=el('div','modal-actions');actions.append(button('Cancel',()=>root.replaceChildren()));
  actions.append(button('Move into folder',async()=>{root.replaceChildren();await movePageOnServer(pageId,select.value,siblings(select.value).filter(p=>p.id!==pageId).length);},'btn primary'));
  modal.append(actions);bg.append(modal);bg.onclick=e=>{if(e.target===bg)root.replaceChildren();};root.append(bg);
}
function redrawTree(){
  const root=$('pageTree');root.replaceChildren();
  function walk(parent,target,depth){if(depth>40)return;
    siblings(parent).forEach(p=>{
      const row=el('div','tree-row');row.draggable=!MOBILE_EDITOR;row.dataset.pageId=p.id;
      const nav=el('button','nav-item'+(S.view==='page'&&S.currentId===p.id?' active':''));
      nav.innerHTML='<span class="emoji">'+safe(p.icon||'📄')+'</span><span class="name">'+safe(p.title)+'</span>';
      nav.onclick=()=>navigate('page',p.id);row.append(nav);
      const actions=el('div','tree-controls');
      const add=button('＋',()=>addPage(p.id),'');add.title='New subpage';
      const up=button('↑',()=>shiftPage(p.id,-1),'');up.title='Move up';
      const down=button('↓',()=>shiftPage(p.id,1),'');down.title='Move down';
      const move=button('↳',()=>openMoveModal(p.id),'');move.title='Move to folder';
      actions.append(add,up,down,move);row.append(actions);target.append(row);
      row.ondragstart=e=>{e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move';row.classList.add('dragging');};
      row.ondragend=()=>{document.querySelectorAll('.drag-target,.drag-before,.drag-after,.dragging').forEach(n=>n.classList.remove('drag-target','drag-before','drag-after','dragging'));};
      row.ondragover=e=>{const dragging=e.dataTransfer.types.includes('text/plain');if(!dragging)return;e.preventDefault();const r=row.getBoundingClientRect(),pos=(e.clientY-r.top)/r.height;row.classList.toggle('drag-before',pos<.24);row.classList.toggle('drag-after',pos>.76);row.classList.toggle('drag-target',pos>=.24&&pos<=.76);};
      row.ondragleave=()=>row.classList.remove('drag-target','drag-before','drag-after');
      row.ondrop=e=>{e.preventDefault();e.stopPropagation();const source=e.dataTransfer.getData('text/plain');if(!source||source===p.id)return;const bounds=row.getBoundingClientRect(),rel=(e.clientY-bounds.top)/bounds.height;
        if(rel>=.24&&rel<=.76){if(pageDescendants(source).has(p.id)){notify('Cannot move into own subfolder');return;}movePageOnServer(source,p.id,siblings(p.id).length);}
        else {const dest=siblings(p.parentId).filter(x=>x.id!==source);let at=dest.findIndex(x=>x.id===p.id);if(rel>.76)at++;movePageOnServer(source,p.parentId,at);}
      };
      const sub=el('div','page-child');walk(p.id,sub,depth+1);if(sub.childNodes.length)target.append(sub);
    });
  }
  walk('',root,0);
}
function navigate(view,id){closeBlockMenu();S.view=view;S.currentId=id||null;closeSidebar();render();}
function render(){scheduleCache();redrawTree();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===S.view));$('breadcrumb').textContent=S.view==='page'?(pageById(S.currentId)?.title||'Page'):{home:'Home',tasks:'Tasks',search:'Search',settings:'Settings'}[S.view];const c=$('content');c.replaceChildren();const div=el('div','page-container');c.append(div);if(S.view==='home')renderHome(div);else if(S.view==='tasks')renderTasks(div);else if(S.view==='page')renderPage(div);else if(S.view==='search')renderSearch(div);else renderSettings(div);}
function heading(container,eyebrow,title,action){const h=el('div','panel-head');const left=el('div');left.innerHTML='<div class="eyebrow">'+safe(eyebrow)+'</div><h1 class="panel-title">'+safe(title)+'</h1>';h.append(left);if(action)h.append(action);container.append(h);}
function button(label,fn,cls='btn'){const b=el('button',cls,label);b.type='button';/* never submit a form by accident (Delete/Cancel used to also Save) */b.addEventListener('click',fn);return b;}
function markDirty(id){S.dirty.add(id);S.unsynced.add(id);scheduleCache();status('Unsaved changes');clearTimeout(S.timers.get(id));S.timers.set(id,setTimeout(()=>savePageNow(id),MOBILE_EDITOR?2200:900));}
function savePageNow(id){clearTimeout(S.timers.get(id));S.timers.delete(id);if(!S.dirty.has(id))return S.queues.get(id)||Promise.resolve();const p=pageById(id);if(!p)return Promise.resolve();S.dirty.delete(id);const snapshot=JSON.parse(JSON.stringify({id:p.id,title:p.title,icon:p.icon,blocks:p.blocks}));const prev=S.queues.get(id)||Promise.resolve();const next=prev.catch(()=>{}).then(async()=>{S.saving++;status('Saving…');try{const res=await api('savePage',snapshot);const live=pageById(id);if(live)live.updatedAt=res.updatedAt;if(!S.dirty.has(id))S.unsynced.delete(id);scheduleCache();if(res.trashWarnings?.length){status('Saved; Drive cleanup needs attention',true);notify(res.trashWarnings[0]);}else if(!S.dirty.size)status('All changes saved ✓');}catch(e){if(e.offline){status('ออฟไลน์ · เก็บไว้ในเครื่องแล้ว',true);}else{S.dirty.add(id);error(e);}}finally{S.saving--;}});S.queues.set(id,next);return next;}
function focusBlock(id,position){const f=document.querySelector('[data-block-id="'+id+'"] textarea');if(f){f.focus();const n=position==='end'?f.value.length:Number.isInteger(position)?position:0;f.setSelectionRange(n,n);}}
function newBlock(type='paragraph'){return{id:crypto.randomUUID(),type,text:'',checked:false,indent:0};}
function indentLevel(b){return Math.max(0,Math.min(8,Number(b.indent)||0));}
function changeBlockIndent(p,b,delta){const next=Math.max(0,Math.min(8,indentLevel(b)+delta));if(next===indentLevel(b))return false;b.indent=next;markDirty(p.id);const row=document.querySelector('[data-block-id="'+b.id+'"]');if(row)row.dataset.indent=String(next);return true;}
function handleBlockEnter(p,b,index,field){
  // Enter always continues a checklist, even if it is empty.
  const start=field.selectionStart,end=field.selectionEnd,content=field.value;
  b.text=content.slice(0,start);field.value=b.text;autosize(field);
  const nb=newBlock(b.type==='checklist'?'checklist':'paragraph');
  nb.text=content.slice(end);nb.indent=indentLevel(b);
  const actualIndex=p.blocks.findIndex(x=>x.id===b.id);
  if(actualIndex<0)return;
  p.blocks.splice(actualIndex+1,0,nb);markDirty(p.id);
  // No full editor redraw on each Enter: essential for older phones / long pages.
  const current=field.closest('.block-wrap');
  if(current&&current.parentNode){
    const nextRow=createBlockRow(p,nb);current.after(nextRow);
    const nextField=nextRow.querySelector('textarea');
    if(nextField){autosize(nextField);nextField.focus();nextField.setSelectionRange(0,0);}
  }else{renderBlocks(p);focusBlock(nb.id,0);}
}
function handleEmptyBlockBackspace(p,b,index,field){
  if(field.value.length||field.selectionStart!==0||field.selectionEnd!==0)return false;
  // First remove indentation; do not accidentally delete the block.
  if(indentLevel(b)>0){changeBlockIndent(p,b,-1);return true;}
  // An empty checklist / heading becomes normal text, preserving its position.
  if(b.type!=='paragraph'){
    b.type='paragraph';b.checked=false;markDirty(p.id);renderBlocks(p);focusBlock(b.id);return true;
  }
  if(index>0){p.blocks.splice(index,1);markDirty(p.id);const row=field.closest('.block-wrap');if(row&&row.parentNode){row.remove();}else renderBlocks(p);focusBlock(p.blocks[index-1].id,'end');return true;}
  return false;
}
function convertBlockType(pageId,blockId,type){
  const p=pageById(pageId);if(!p)return;
  const b=p.blocks.find(x=>x.id===blockId);if(!b||b.type==='file')return;
  // Convert IN PLACE: do not introduce a new blank row or lose entered text.
  b.type=type;if(type!=='checklist')b.checked=false;
  markDirty(pageId);closeBlockMenu();const oldRow=Array.from(document.querySelectorAll('#blocks .block-wrap')).find(r=>r.dataset.blockId===b.id);if(oldRow){oldRow.replaceWith(createBlockRow(p,b));}else renderBlocks(p);focusBlock(b.id,'end');
}

let treeRefreshTimer=0;
function scheduleTreeRefresh(){clearTimeout(treeRefreshTimer);treeRefreshTimer=setTimeout(()=>redrawTree(),350);}
function renderPage(c){const p=pageById(S.currentId);if(!p){navigate('home');return;}const tools=el('div','toolbar');tools.append(button('＋ Subpage',()=>addPage(p.id),'btn small'),button('📎 Upload file',()=>chooseAttachments(p.id),'btn small'),button('↳ Move',()=>openMoveModal(p.id),'btn small'),button('↑',()=>shiftPage(p.id,-1),'btn small'),button('↓',()=>shiftPage(p.id,1),'btn small'),button('Delete page',()=>removePage(p.id),'btn small danger'));const eyebrow=el('div','eyebrow',MOBILE_EDITOR?'แตะบรรทัดเพื่อแก้ไข · ⇥ / ⇤ ใต้บรรทัด: ย่อหน้า · 📅: ใส่วันที่ · ⋮: เปลี่ยนชนิดบล็อก':'Enter: continue to-do even when empty · Tab / Shift+Tab: indent · Backspace on empty: outdent · ⋮: change block type · @date: insert date');c.append(eyebrow);const icon=el('button','page-icon',p.icon);icon.style.background='none';icon.style.border='0';icon.title='Change icon';icon.onclick=()=>{const next=prompt('Choose a page emoji',p.icon);if(next!==null&&next.trim()){p.icon=next.trim().slice(0,12);markDirty(p.id);render();}};c.append(icon);const title=el('input','page-title');title.placeholder='Untitled';title.value=p.title;title.setAttribute('aria-label','Page title');title.addEventListener('input',()=>{p.title=title.value;markDirty(p.id);$('breadcrumb').textContent=p.title;scheduleTreeRefresh();});c.append(title);c.append(tools);c.append(renderPageTasks(p));const area=el('div');area.style.marginTop='35px';area.id='blocks';c.append(area);renderBlocks(p);c.append(button('📎 Upload any file (up to 5 GiB)',()=>chooseAttachments(p.id),'btn small'));c.append(button('＋ Add a block',()=>{const b=newBlock();p.blocks.push(b);markDirty(p.id);renderBlocks(p);focusBlock(b.id);},'add-block'));}
function isoOf(y,m,d){const n=x=>String(x).padStart(2,'0');return y+'-'+n(m+1)+'-'+n(d);}
function addDaysISO(days){const d=new Date();d.setDate(d.getDate()+days);return isoOf(d.getFullYear(),d.getMonth(),d.getDate());}
/** Lightweight calendar made of plain buttons: no native picker, no keyboard. */
function buildCalendar(initial,onPick){
  const wrap=el('div','cal');
  const start=/^\d{4}-\d{2}-\d{2}$/.test(initial||'')?new Date(initial+'T00:00:00'):new Date();
  let y=start.getFullYear(),m=start.getMonth();
  const tb=(t,fn,cls='')=>{const x=button(t,fn,cls);x.type='button';return x;};
  const quick=el('div','cal-quick');
  quick.append(tb('วันนี้',()=>onPick(addDaysISO(0))),tb('พรุ่งนี้',()=>onPick(addDaysISO(1))),tb('+7 วัน',()=>onPick(addDaysISO(7))));
  const head=el('div','cal-head'),title=el('span','cal-title');
  head.append(tb('‹',()=>{m--;if(m<0){m=11;y--;}draw();}),title,tb('›',()=>{m++;if(m>11){m=0;y++;}draw();}));
  const grid=el('div','cal-grid');
  function draw(){
    title.textContent=new Date(y,m,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});
    const f=document.createDocumentFragment();
    ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(w=>f.append(el('div','wd',w)));
    for(let i=0;i<new Date(y,m,1).getDay();i++)f.append(el('div'));
    const days=new Date(y,m+1,0).getDate(),today=localISODate();
    for(let d=1;d<=days;d++){const iso=isoOf(y,m,d);
      f.append(tb(String(d),()=>onPick(iso),(iso===today?'today ':'')+(iso===initial?'sel':'')));}
    grid.replaceChildren(f);
  }
  draw();wrap.append(quick,head,grid);return wrap;
}
/** On phones, small <select>s become tap buttons (the native dropdown was freezing). */
function enhanceSelect(sel){
  if(!MOBILE_EDITOR||sel.options.length>4||!sel.parentNode)return sel;
  const seg=el('div','seg');sel.style.display='none';
  const sync=()=>seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===sel.value));
  Array.from(sel.options).forEach(o=>{const x=el('button','',o.textContent||'—');x.type='button';x.dataset.v=o.value;
    x.onclick=()=>{if(sel.value===o.value)return;sel.value=o.value;sync();sel.dispatchEvent(new Event('change'));};seg.append(x);});
  sel.after(seg);sync();return sel;
}
function openMentionDate(anchor,onChoose){
  document.querySelectorAll('.mention-pop').forEach(n=>n.remove());

  const top=el('div','cal-head');top.append(el('span','','📅 เลือกวันที่'),close);
  popup.append(top,buildCalendar(localISODate(),choose));

  function choose(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||!popup.isConnected)return;popup.remove();onChoose(v);}
}
function dateToken(text,date){const base=text.replace(/@(?:date|deadline)?\s*$/i,'');return base+(base&&!/\s$/.test(base)?' ':'')+'@'+date;}
function attachAtDate(field,onDate){let last='';field.addEventListener('input',()=>{
  const text=field.value;const position=field.selectionStart;const prefix=text.slice(0,position);
  if(/@(?:date|deadline)?\s*$/i.test(prefix)&&prefix!==last){last=prefix;openMentionDate(field,onDate);}

function localISODate(){const d=new Date(),n=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+n(d.getMonth()+1)+'-'+n(d.getDate());}
function prettyDate(iso){if(!iso)return'';const d=new Date(iso);return Number.isNaN(d.valueOf())?iso:d.toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function createBlockRow(p,b){
  const row=el('div','block-wrap');row.dataset.blockId=b.id;row.dataset.indent=String(indentLevel(b));
  const handles=el('div','block-handle');
  const plus=el('button','','＋');plus.type='button';plus.title='Add block after';plus.setAttribute('aria-label','Add block after');
  plus.onclick=()=>{const i=p.blocks.findIndex(x=>x.id===b.id);if(i>=0)showBlockMenu(plus,p.id,i+1,'insert');};
  const more=el('button','','⋮');more.type='button';more.title='Change block type';more.setAttribute('aria-label','Change block type');
  more.onclick=()=>{const i=p.blocks.findIndex(x=>x.id===b.id);if(i>=0)showBlockMenu(more,p.id,i,'convert');};
  handles.append(plus,more);row.append(handles);
  if(b.type==='divider'){row.append(el('div','divider-block'));return row;}
  if(b.type==='file'){row.append(renderAttachmentBlock(p,b));return row;}
  let field;
  if(b.type==='checklist'){
    const check=el('input','check');check.type='checkbox';check.checked=!!b.checked;
    check.setAttribute('aria-label','Mark task complete');
    check.onchange=()=>{b.checked=check.checked;field.classList.toggle('checked',b.checked);markDirty(p.id);};row.append(check);
  }
  field=el('textarea','block-field block-'+b.type+(b.checked?' checked':''));field.rows=1;
  field.placeholder=b.type==='heading'?'Heading 1':b.type==='heading2'?'Heading 2':b.type==='quote'?'Quote':b.type==='checklist'?'To-do':"Type something…";

const SMALL_UPLOAD_BYTES=8*1024*1024;
const CHUNK_BYTES=8*1024*1024;
function fileCategory(mime){if(mime==='application/pdf')return 'PDF';if(mime.includes('word'))return 'Word';if(mime.includes('sheet')||mime.includes('excel'))return 'Excel';if(mime.includes('presentation')||mime.includes('powerpoint'))return 'PowerPoint';if(mime.startsWith('image/'))return 'Image';return 'File';}
function prettyBytes(bytes){const x=Number(bytes)||0;return x<1024?x+' B':x<1048576?(x/1024).toFixed(1)+' KB':x<1073741824?(x/1048576).toFixed(1)+' MB':(x/1073741824).toFixed(2)+' GB';}
function renderAttachmentBlock(page,b){
  const outer=el('div');outer.style.flex='1';outer.style.minWidth='0';
  const item=el('div','attachment');item.append(el('span','file-icon',b.mimeType==='application/pdf'?'📕':b.mimeType?.startsWith('image/')?'🖼️':'📄'));
  const info=el('div','file-info');info.append(el('div','file-name',b.fileName||'Attachment'));info.append(el('div','file-meta',fileCategory(b.mimeType||'')+' · '+prettyBytes(b.sizeBytes)));item.append(info);
  if(b.driveUrl){const link=el('a','btn small','Open in Drive ↗');link.href=b.driveUrl;link.target='_blank';link.rel='noopener noreferrer';item.append(link);}
  if(b.mimeType==='application/pdf'&&b.fileId){
    const toggle=button('Preview PDF',()=>{
      let panel=outer.querySelector('.file-preview');if(panel){panel.remove();toggle.textContent='Preview PDF';return;}
      panel=el('div','file-preview');const frame=el('iframe');frame.title='PDF preview: '+b.fileName;
      frame.src='https://drive.google.com/file/d/'+encodeURIComponent(b.fileId)+'/preview';frame.loading='lazy';panel.append(frame);outer.append(panel);toggle.textContent='Hide preview';
    },'btn small');item.append(toggle);
  }
  outer.append(item);return outer;
}
function readBase64(file){return new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onerror=()=>reject(new Error('Unable to read file'));
  reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.readAsDataURL(file);
});}
/** Browser sends binary chunks DIRECTLY to Google Drive; Apps Script only initiates
 * and finalizes metadata. Session URLs act like secret temporary credentials.
 * Avoid logging them or storing them in Sheets. */
function putChunk(url, file, start, end) {
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('PUT',url,true);
    xhr.setRequestHeader('Content-Range','bytes '+start+'-'+(end-1)+'/'+file.size);
    xhr.onload=()=>resolve({status:xhr.status,range:xhr.getResponseHeader('Range'),body:xhr.responseText});
    xhr.onerror=()=>reject(new Error('Direct Google Drive upload blocked or network unavailable (possible browser CORS restriction).'));
    xhr.ontimeout=()=>reject(new Error('Network timeout while uploading chunk'));
    xhr.timeout=120000;
    xhr.send(file.slice(start,end));
  });
}
async function uploadLargeFile(pageId,file,progress){
  const session = await api('startLargeAttachment',pageId,{
    name:file.name, mimeType:file.type||'application/octet-stream',sizeBytes:file.size
  },location.origin);
  // The session URL is short-lived and must never be exposed to other users.
  let offset=0, completed=null;
  while(offset<file.size){
    const end=Math.min(offset+CHUNK_BYTES,file.size);
    let result;
    for(let tries=0;tries<4;tries++){
      try{result=await putChunk(session.sessionUrl,file,offset,end);break;}
      catch(e){if(tries===3)throw e;await new Promise(r=>setTimeout(r,1000*(tries+1)));}
    }
    if(result.status===308){
      const match=/bytes=0-(\d+)/.exec(result.range||'');
      const next=match?Number(match[1])+1:end;
      if(next<=offset)throw new Error('Google Drive did not accept the uploaded chunk');
      offset=next;
    }else if(result.status===200||result.status===201){
      completed=JSON.parse(result.body);offset=file.size;
    }else{
      throw new Error('Google Drive upload returned HTTP '+result.status+' '+String(result.body||'').slice(0,160));
    }
    progress.textContent='Uploading '+file.name+' — '+Math.round(offset/file.size*100)+'% ('+prettyBytes(offset)+' / '+prettyBytes(file.size)+')';
  }
  if(!completed?.id)throw new Error('Google Drive did not confirm completion');
  return api('finishLargeAttachment',pageId,completed.id);
}
function chooseAttachments(pageId,insertIndex){
  const input=el('input');input.type='file';input.multiple=true;
  input.style.display='none';document.body.append(input);
  input.onchange=async()=>{
    const files=Array.from(input.files||[]);input.remove();if(!files.length)return;
    const p=pageById(pageId);if(!p){notify('Page is no longer available');return;}
    const progress=el('div','upload-progress');progress.setAttribute('role','status');
    const area=$('blocks');if(area)area.before(progress);else $('toastRoot').append(progress);
    let complete=0;
    for(let i=0;i<files.length;i++){
      const file=files[i];progress.textContent='Uploading '+(i+1)+' / '+files.length+': '+file.name;
      if(file.size>MAX_ATTACHMENT_BYTES){notify(file.name+' exceeds the 5 GiB per-file limit.');continue;}
      if(!file.size){notify('Empty file: '+file.name);continue;}
      try{
        let result;
        if(file.size<=SMALL_UPLOAD_BYTES){
          const payload={name:file.name,mimeType:file.type||'application/octet-stream',base64:await readBase64(file)};
          result=await api('uploadAttachment',pageId,payload);
        }else{
          result=await uploadLargeFile(pageId,file,progress);
        }
        const block=Object.assign(newBlock('file'),{
          fileId:result.fileId,fileName:result.fileName,mimeType:result.mimeType,
          sizeBytes:result.sizeBytes,driveUrl:result.driveUrl
        });
        if(Number.isInteger(insertIndex)){p.blocks.splice(insertIndex+complete,0,block);}else p.blocks.push(block);
        complete++;markDirty(pageId);
        await savePageNow(pageId);
        if(S.view==='page'&&S.currentId===pageId)renderBlocks(p);
      }catch(err){error(err);notify('Upload failed for '+file.name+'. See the error and README fallback.');}
    }
    progress.remove();if(complete)notify(complete+' file(s) added. Stored in your Google Drive.');
  };
  input.click();
  setTimeout(()=>{if(input.isConnected&&!input.files?.length)input.remove();},120000);
}
function renderSettings(c){
  heading(c,'Your workspace','Settings');
  const conn=getConn();
  c.append(el('h2','section-heading','การเชื่อมต่อ'));
  c.append(el('p','muted',conn?('Apps Script: …'+conn.url.slice(-28)+' · key ••••'+conn.key.slice(-4)):'ยังไม่ได้เชื่อมต่อ'));
  c.append(el('p','muted',S.unsynced.size?('มี '+S.unsynced.size+' หน้าที่ยังไม่ได้ซิงก์ (เก็บไว้ในเครื่องแล้ว)'):'ข้อมูลในเครื่องตรงกับ Google Sheets'));
  c.append(el('p','muted','Google Calendar: '+(S.calendarSync?'✓ ซิงก์สองทางเปิดอยู่ (ปฏิทิน "NotionLite Tasks")':'ยังไม่เปิด — รัน enableCalendarSync ใน Apps Script')));
  const bar=el('div','toolbar');
  bar.append(button('ซิงก์ตอนนี้',async()=>{resyncUnsynced();await refreshFromServer(false,true);render();}));
  bar.append(button('เปลี่ยนการเชื่อมต่อ',()=>{
    if(S.unsynced.size&&!confirm('ยังมีการแก้ไขที่ไม่ได้ซิงก์ '+S.unsynced.size+' หน้า ถ้าเปลี่ยนตอนนี้จะหายไป ทำต่อ?'))return;
    try{localStorage.removeItem(CONN_KEY);localStorage.removeItem(CACHE_KEY);}catch(_){}
    S.pages=[];S.tasks=[];S.unsynced.clear();S.dirty.clear();redrawTree();renderSetup();
  },'btn danger'));
  c.append(bar);
  c.append(el('h2','section-heading','Your Google Sheets database'));
  c.append(el('p','muted','Your pages and tasks are stored in a spreadsheet owned by your Google account. Avoid manually changing IDs, header rows, or JSON data.'));
  if(S.dbUrl){const a=el('a','db-link',S.dbUrl);a.href=S.dbUrl;a.target='_blank';a.rel='noopener noreferrer';c.append(a);}
  c.append(el('h2','section-heading','About this app'));
  c.append(el('p','muted','NotionLite v13 standalone · ทำงานตรงใน Chrome · เก็บสำเนาไว้ในเครื่องเพื่อเปิดเร็ว แล้วซิงก์กับ Google Sheets เบื้องหลัง'));
}
function renderSetup(){
  S.view='setup';$('breadcrumb').textContent='เชื่อมต่อ';status('');
  const c=$('content'),div=el('div','page-container');c.replaceChildren(div);
  heading(div,'ตั้งค่าครั้งแรก','เชื่อมต่อกับ Google Sheets');
  div.append(el('p','muted','วางลิงก์ Web app (ลงท้ายด้วย /exec) และรหัสแอปที่ได้จาก createApiKey() ใน Apps Script ตั้งค่าครั้งเดียว เครื่องจะจำไว้'));
  const form=el('form');
  const mk=(label,ph)=>{const w=el('div','formfield');w.append(el('label','',label));const i=el('input');i.placeholder=ph;i.autocomplete='off';i.spellcheck=false;i.setAttribute('autocapitalize','off');w.append(i);form.append(w);return i;};
  const url=mk('Web app URL','https://script.google.com/macros/s/…/exec');
  const key=mk('App key','รหัส 64 ตัวอักษร');
  const go=button('เชื่อมต่อ',()=>{},'btn primary');go.type='submit';
  const msg=el('p','hint');form.append(go,msg);div.append(form);
  form.onsubmit=async e=>{e.preventDefault();
    const conn={url:url.value.trim(),key:key.value.trim()};
    if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/.test(conn.url)){msg.textContent='ลิงก์ต้องเป็น https://script.google.com/macros/s/…/exec';return;}
    if(!/^[0-9a-f]{64}$/i.test(conn.key)){msg.textContent='รหัสแอปต้องเป็นตัวอักษร 64 ตัว (คัดลอกจาก Execution log)';return;}
    go.disabled=true;msg.textContent='กำลังเชื่อมต่อ…';
    try{const data=await callApi(conn,'getInitialData',[]);
      localStorage.setItem(CONN_KEY,JSON.stringify(conn));
      S.pages=data.pages;S.tasks=data.tasks;S.dbUrl=data.spreadsheetUrl;status('Connected ✓');navigate('home');notify('เชื่อมต่อสำเร็จ');
    }catch(err){go.disabled=false;msg.textContent='เชื่อมต่อไม่ได้: '+err.message;}
  };
}
function closeSidebar(){$('sidebar').classList.remove('open');$('overlay').classList.remove('active');}
/* v13 standalone: keep a copy on the phone so the app opens instantly, then sync. */
let cacheTimer=0;
function scheduleCache(){clearTimeout(cacheTimer);cacheTimer=setTimeout(writeCache,300);}
function writeCache(){clearTimeout(cacheTimer);if(!getConn())return;
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({pages:S.pages,tasks:S.tasks,dbUrl:S.dbUrl,unsynced:[...S.unsynced],at:Date.now()}));}
  catch(e){console.warn('Local copy not saved',e);}}
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(_){return null;}}
function isTyping(){const a=document.activeElement;return !!(a&&$('content').contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName));}
function resyncUnsynced(){[...S.unsynced].forEach(id=>{if(pageById(id)){S.dirty.add(id);savePageNow(id);}else S.unsynced.delete(id);});}
let lastRefresh=0;
async function refreshFromServer(initial,force){
  lastRefresh=Date.now();
  if(!initial||!S.pages.length)status('กำลังซิงก์…');
  try{
    const before=JSON.stringify([S.pages,S.tasks]);
    const seq=S.mutSeq||0;
    const data=await api('getInitialData',!!force);
    if(S.inflight||(S.mutSeq||0)!==seq){ // data is older than your latest change: ask again shortly
      if(!S.retryRefresh)S.retryRefresh=setTimeout(()=>{S.retryRefresh=0;refreshFromServer(true,force);},1500);
      return;
    }
    S.calendarSync=!!data.calendarSync;
    const keep=new Set([...S.unsynced,...S.dirty]);
    if(S.view==='page'&&isTyping())keep.add(S.currentId); // never swap out the page you are typing in
    const local=new Map(S.pages.map(p=>[p.id,p]));
    S.pages=data.pages.map(p=>keep.has(p.id)&&local.has(p.id)?local.get(p.id):p);
    S.tasks=data.tasks;S.dbUrl=data.spreadsheetUrl;
    [...S.unsynced].forEach(id=>{if(!pageById(id))S.unsynced.delete(id);});
    const changed=JSON.stringify([S.pages,S.tasks])!==before;
    // Redraw only when something changed, and keep your scroll position.
    if(changed){if(isTyping())redrawTree();else if(S.view!=='setup'){const sc=$('content').scrollTop;render();$('content').scrollTop=sc;}}
    status(S.unsynced.size?'กำลังบันทึกที่ค้างไว้…':'Synced ✓');
    resyncUnsynced();
  }catch(e){
    if(S.pages.length){status(e.offline?'ออฟไลน์ · ใช้สำเนาในเครื่อง':'ซิงก์ไม่สำเร็จ',true);if(!e.offline)notify('Sync error: '+e.message);return;}
    status('ซิงก์ไม่สำเร็จ',true);
    const c=$('content'),d=el('div','page-container');d.append(el('h2','','เปิดข้อมูลไม่ได้'),el('p','muted',e.message||String(e)));
    const bar=el('div','toolbar');bar.append(button('ลองอีกครั้ง',()=>refreshFromServer(false),'btn primary'),button('ตั้งค่าการเชื่อมต่อใหม่',()=>renderSetup()));d.append(bar);c.replaceChildren(d);
  }
}
async function load(){return refreshFromServer(false);}
function boot(){
  if(!getConn()){renderSetup();return;}
  const cached=readCache();
  if(cached&&Array.isArray(cached.pages)){
    S.pages=cached.pages;S.tasks=cached.tasks||[];S.dbUrl=cached.dbUrl||'';
    (cached.unsynced||[]).forEach(id=>S.unsynced.add(id));
    render();status('สำเนาในเครื่อง · กำลังซิงก์…');
  }else status('Connecting to Google Sheets…');
  refreshFromServer(true);
}
/* Near real-time: pull fresh data (incl. Google Calendar edits) when the app comes
 * back to the screen and every minute while open — never while you are typing. */
function softRefresh(){
  if(!getConn()||document.hidden||S.view==='setup'||S.dirty.size||S.saving||isTyping()||document.querySelector('.modal-back,.mention-pop,.block-menu'))return;
  if(Date.now()-lastRefresh<20000)return;
  refreshFromServer(true);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(softRefresh,300);});
setInterval(softRefresh,60000);
// Save right away when you switch apps or lock the phone.
document.addEventListener('visibilitychange',()=>{if(document.hidden){writeCache();[...S.dirty].forEach(savePageNow);}});
window.addEventListener('online',()=>{status('ออนไลน์แล้ว · กำลังซิงก์…');resyncUnsynced();});
setInterval(()=>{if(S.unsynced.size&&!S.dirty.size&&!S.saving&&navigator.onLine)resyncUnsynced();},30000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));
$('addRoot').onclick=()=>addPage('');$('newPageTop').onclick=()=>addPage('');$('menuBtn').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('active');};$('overlay').onclick=closeSidebar;
$('themeBtn').onclick=()=>{S.theme=S.theme==='light'?'dark':'light';localStorage.setItem('notionlite-theme',S.theme);document.body.classList.toggle('dark',S.theme==='dark');};
window.addEventListener('beforeunload',e=>{if(S.dirty.size||S.saving){e.preventDefault();e.returnValue='';}});
boot();
